$kind: http-request
name: Auth / Login
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "user@example.com",
      "password": "YourStrongP@ss1"
    }
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      if (j.accessToken) pm.collectionVariables.set('token', j.accessToken);
    language: text/javascript
order: 1000
